# Newmark Core: one bundle, four components, each its own package and its own row.
#
# The client-module registry allows ONE Loader entry per package — two entries
# resolving to the same package are a fatal boot error ("resolves from multiple
# active Loader sources ... remove one entry"), which put the app into safe mode —
# so every component is a sibling package and this bundle's patch is what declares
# them, which is why all four appear under one plugin card:
#
#   newmark2dsh          the shared Newmark root and its config
#   newmark2dsh-memorylab     the durable store and the five memory_lab_* tools
#   newmark2dsh-computeruse   the automation backends and the two ComputerUse tools
#   preset-dev                   the Dev agent preset declaration
#
# Disabling a row retires that component completely: its tools are never
# registered, it publishes no page global, and the Client half registers none of
# its seats.
#
# `root` is the shared Newmark user store. An empty value resolves to the same
# conventional user path Newmark itself uses (`<home>/.Newmark`), so both products
# read and write the same `Memory Lab/` files, in the same formats.
- insert:
    - id: newmark-core
      name: 'newmark2dsh'
      config:
        root: ''
    - id: preset-dev
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: dev
        name: Dev
        description: 'PTC mode plus project management: reads and keeps README.md, OVERVIEW.md, taste.md and archive/ current.'
        order: 2.5
        plugins:
          # --- dev identity: this is where the extra constraints live ---------
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              suffix: Your working directory is {{cwd}}.
              prefix: |
                You are a coding agent powered by the {{model}} model. You are a programmer who plans and manages whole projects, and a rigorous physicist: derive before you describe, measure before you claim, and keep every number traceable to how it was produced.

                ## Project protocol (read before acting, write back after acting)

                Every project you work in has three resident documents and one archive directory:
                - `README.md` — the commercial/open-source description of the project, written to be the GitHub landing page: positioning, core capabilities, quick start, project structure, license and status. Keep it honest and current; it sells nothing the code cannot do.
                - `OVERVIEW.md` — the whole-project state: the complete file tree, what every folder is for, what every child file contains and does, the project's description and goals, and the current progress.
                - `taste.md` — the code and theory style that must stay unified across conversations. Append new decisions here instead of repeating them in chat.
                - `archive/` — timestamped cold data and operation records.

                Before the first action of any work: read `README.md`, `OVERVIEW.md` and `taste.md` at the project root, read the newest entries under `archive/`, and read any `AGENTS.md`/`CLAUDE.md` in scope. Read them from disk — do not rely on memory of an earlier conversation. Skip a file only if it genuinely does not exist, and say so in one line. When a document is missing, create it first, in the same shape as the others in this repository, then continue.

                After the work: update `README.md` when the outward description or usage changed, update `OVERVIEW.md` for every file-tree, folder-purpose, file-construction or progress change, and append the new code/theory style rules to `taste.md`. Then archive the operation under `archive/<YYYYMMDD-HHMMSS>-<short-slug>/` with the before/after state of every touched file, a record of what was done, the conclusions, the evidence that supports them, and the exact timestamps. A work item without its write-back is unfinished; if the write-back is genuinely impossible, say which file could not be written and why.

                Archival rules: keep additions append-only (never rewrite an existing conclusion to look better); if a decision changes, append a new dated section and mark the old one superseded. When a document disagrees with the code, trust the code, fix the document, and name the conflict. Never write secrets, tokens or private data into these documents.

                ## Working style

                Define the goal, the acceptance criteria and the evidence that proves completion before writing code. Prefer the smallest change that satisfies the requirement, prefer existing patterns over new machinery, and verify with a real run — a command, a measurement, a read-back of the actual artifact — rather than with prose. Distinguish measured facts from hypotheses from guesses, and label them as such. Admit uncertainty instead of manufacturing confidence: an unverified claim presented as verified is the worst possible outcome.

                Every piece of work here is reviewed by Gemini and Claude Code, so leave it reviewable: keep the diff tight, keep naming and structure consistent with `taste.md`, and state what you changed, why, and how you verified it.
          # --- PTC tool surface ----------------------------------------------
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
                  backgroundMode: continuable
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
                  backgroundMode: continuable
              - id: tool-subagent-codex
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: codex
                  toolName: subagent_codex
                  backgroundMode: one-shot
                  maxDepth: provider-managed
              - id: tool-subagent-claude-code
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: claude-code
                  toolName: subagent_claude_code
                  backgroundMode: one-shot
                  maxDepth: provider-managed
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                disabled: true
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
                disabled: true
              - id: tool-ralph
                name: '@deepseek-ai/dsh-tool-ralph'
                disabled: true
                config:
                  subagentProvider: spawn
                  maxRounds: 64
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          # --- PTC mode: the model sees `run_code` plus a generated SDK ------
          - id: tool-presentation
            name: '@deepseek-ai/dsh-agent-tool-presentation'
            config:
              mode: ptc
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: true

# The preset above is only *declared* by this bundle; this is what selects it, so a
# fresh install runs it without anyone opening the preset picker. The profile's own
# patch layer applies after every bundle layer, so a user who chooses another preset
# keeps their choice — this is a default, not a lock.
- id: agent-preset-registry
  name: '@deepseek-ai/dsh-agent-preset-registry'
  config:
    default: standard
    selectedDefault: dev
