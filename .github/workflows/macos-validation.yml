name: Apple Silicon release validation
on:
  push:
    branches: [codex/macos-space-validation]
  workflow_dispatch:
    inputs:
      probe_only:
        type: boolean
        default: false
        description: Run only the Mission Control UI availability probe
concurrency:
  group: macos-validation-${{ github.ref }}-${{ inputs.probe_only }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    if: ${{ !inputs.probe_only }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Record actual environment
        run: |
          sw_vers
          uname -m
          xcrun swiftc --version
      - name: Run isolated Mac dispatch contracts
        run: |
          node scripts/verify-darwin-prototype.mjs
          node scripts/verify-darwin-accessibility.mjs
          node scripts/verify-darwin-space-input.mjs
          node scripts/verify-darwin-pet-border.mjs
          node scripts/verify-darwin-channels.mjs
          node scripts/verify-newmate-todo.mjs
          node scripts/verify-newmate-todo-activation.mjs
          node scripts/verify-short-memory-mcp.mjs
      - name: Compile native CU and pet with macOS SDK
        run: |
          xcrun swiftc -parse-as-library components/computeruse/lib/darwin-native.swift -o "$RUNNER_TEMP/newmark-cu" -framework AppKit -framework ScreenCaptureKit
          xcrun swiftc -parse-as-library components/computeruse/lib/desktop-pet-darwin.swift -o "$RUNNER_TEMP/newmark-pet" -framework AppKit -framework CoreGraphics
      - name: Native production contour at 1x and 2x backing scale
        env:
          NEWMARK_EVIDENCE_DIR: ${{ runner.temp }}/newmark-evidence
        run: node scripts/verify-darwin-border-scale.mjs
      - name: Read-only native protocol smoke
        env:
          NEWMARK_NATIVE_BINARY: ${{ runner.temp }}/newmark-cu
        run: node scripts/macos-native-readonly-smoke.mjs
      - name: Owned AppKit fixture native integration
        env:
          NEWMARK_NATIVE_BINARY: ${{ runner.temp }}/newmark-cu
        run: node scripts/verify-darwin-native-fixture.mjs
      - name: Full owned render and operation pipeline
        env:
          NEWMARK_NATIVE_BINARY: ${{ runner.temp }}/newmark-cu
          NEWMARK_EVIDENCE_DIR: ${{ runner.temp }}/newmark-evidence
        run: node scripts/verify-darwin-render-pipeline.mjs
      - name: Real NewMate client browser rendering
        env:
          NEWMARK_WEB_DEPS: ${{ runner.temp }}/newmark-web-deps
          NEWMARK_EVIDENCE_DIR: ${{ runner.temp }}/newmark-evidence
        run: |
          npm install --prefix "$NEWMARK_WEB_DEPS" --no-package-lock --no-audit --no-fund react@18.3.1 react-dom@18.3.1 playwright@1.56.1
          "$NEWMARK_WEB_DEPS/node_modules/.bin/playwright" install chromium webkit
          node scripts/verify-darwin-web-render.mjs
      - name: NewMate todo page with actual kernel on Chromium and WebKit
        env:
          NEWMARK_WEB_DEPS: ${{ runner.temp }}/newmark-web-deps
        run: |
          NEWMARK_WEB_ENGINE=chromium NEWMARK_EVIDENCE_DIR="$RUNNER_TEMP/newmark-evidence/todo-chromium" node scripts/verify-newmate-todo-web.mjs
          NEWMARK_WEB_ENGINE=webkit NEWMARK_EVIDENCE_DIR="$RUNNER_TEMP/newmark-evidence/todo-webkit" node scripts/verify-newmate-todo-web.mjs
      - name: Execute todo kernel from npm artifact
        run: |
          mkdir -p "$RUNNER_TEMP/newmark-packed"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/newmark-packed" --json > "$RUNNER_TEMP/newmark-packed/pack.json"
          # Derived, not hard-coded: this step named newmark2dsh-0.3.14.tgz and would have
          # failed the whole macOS matrix the moment the version moved, for a reason that has
          # nothing to do with macOS. The tarball npm just wrote is the one to unpack.
          tgz="$(ls "$RUNNER_TEMP/newmark-packed"/newmark2dsh-*.tgz | head -1)"
          echo "unpacking $tgz"
          tar -xf "$tgz" -C "$RUNNER_TEMP/newmark-packed"
          node --input-type=module -e 'import fs from "node:fs";fs.writeFileSync(process.env.RUNNER_TEMP+"/newmark-packed/test.mjs",fs.readFileSync("scripts/verify-newmate-todo.mjs","utf8").replaceAll("../components/","./package/components/"));'
          node "$RUNNER_TEMP/newmark-packed/test.mjs"
      - name: Preserve owned window render evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-pipeline-${{ matrix.os }}
          path: ${{ runner.temp }}/newmark-evidence
          retention-days: 3
          if-no-files-found: warn
  space_probe:
    if: ${{ inputs.probe_only }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Probe public Mission Control AX surface
        env:
          NEWMARK_EVIDENCE_DIR: ${{ runner.temp }}/space-evidence
        run: |
          mkdir -p "$NEWMARK_EVIDENCE_DIR"
          node scripts/verify-macos-distinct-spaces.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mission-control-probe-${{ matrix.os }}
          path: ${{ runner.temp }}/space-evidence
          retention-days: 3
