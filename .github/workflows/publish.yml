# Publish to npm when a version tag is pushed.
#
# Uses npm Trusted Publishing (OpenID Connect), so there is no token in this
# repository and nothing to rotate. The workflow proves its identity to the npm
# registry with the run's OIDC token, which is minted per job and expires with it.
#
# Configure the npm side once at
#   https://www.npmjs.com/package/newmark2dsh/access  ->  Trusted Publisher
#   Provider: GitHub Actions
#   Repository: positer/newmark2dsh
#   Workflow filename: publish.yml
# The values must match this file exactly or the registry refuses the exchange.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# The tag and `package.json` must agree: a tag can never publish a different
# version than the one in the manifest, so a mistaken tag fails instead of
# shipping something nobody asked for.
name: publish

on:
  push:
    tags:
      - 'v*'

# `id-token: write` is what mints the OIDC token. Without it the publish cannot
# authenticate, and no other permission substitutes for it.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Deliberately no NODE_AUTH_TOKEN: a token here would override the OIDC
      # exchange and quietly turn this back into a long-lived-secret workflow.

      - name: The tag must match the manifest
        run: |
          set -eu
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag v$tag does not match package.json version $version"
            exit 1
          fi
          echo "publishing newmark2dsh $version"

      # The two component packages live inside this bundle and are declared as its
      # The components live inside this bundle and are loaded by the core row from paths
      # in this package — they are NOT declared dependencies. An earlier version of this
      # workflow required them to be, which is what its own guard reported when the
      # design changed, and it correctly blocked the publish until the expectation was
      # brought up to date. The point of the check is unchanged: if a component's
      # manifest or any of its libraries is missing, the published tarball installs and
      # then does nothing, so it is caught here rather than by a user.
      - name: The bundle must be self-contained
        run: |
          set -eu
          fail=0

          # 1. Every component ships, with its manifest, and is composed by the core row.
          #
          #    This list is the one place the workflow states a component roster, and it went
          #    stale exactly the way a roster does: `agent-api` was added to the bundle and the
          #    loop kept checking two, so a tarball that had lost the Agent API half entirely
          #    would still have passed this step. A roster that silently under-covers is worse
          #    than no roster, because it reads as a guarantee.
          for component in memorylab computeruse agent-api; do
            manifest="components/$component/package.json"
            [ -f "$manifest" ] || { echo "::error::missing $manifest"; fail=1; continue; }
            node -e "
              const fs = require('fs');
              const m = JSON.parse(fs.readFileSync('$manifest', 'utf8'));
              if (m.dsh?.client !== undefined) { console.error('$component must not declare dsh.client'); process.exit(1); }
              const index = fs.readFileSync('index.js', 'utf8');
              if (!index.includes(\"./components/$component/index.js\")) {
                console.error('$component is not composed by the core row'); process.exit(1);
              }
            " || fail=1
          done

          # 2. No component is addressed as a package. A `file:` dependency is resolved by
          #    pnpm against the project root rather than this package, so it fails every
          #    registry install; and a bare component name needs one npm package per
          #    component, which is what composing them removed.
          node -e "
            const fs = require('fs');
            const root = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const deps = Object.keys(root.dependencies || {});
            if (deps.length > 0) { console.error('the bundle declares dependencies: ' + deps.join(', ')); process.exit(1); }
            if (JSON.stringify(root).includes('file:')) { console.error('a file: specifier is still present'); process.exit(1); }
            // Compare trimmed lines rather than matching anchored patterns: this script
            // is injected into a double-quoted bash string, and a dollar sign next to a
            // double quote is bash syntax, not a regex anchor. That is exactly how the
            // previous version of this check failed inside the runner.
            const patch = fs.readFileSync('cordis.patch.yml', 'utf8');
            // Keep the indentation. The preset row carries a nested plugin list whose
            // entries also begin with a dash and an id, so trimming counted 'persona' as
            // a third top-level row. A row of this patch is exactly four spaces deep.
            const lines = patch.split('\n');
            const rows = lines
              .filter((line) => line.startsWith('    - id: '))
              .map((line) => line.slice(10).trim());
            // THREE rows, and the third is the one that broke this guard: `preset-rdev` was
            // added to the bundle, the check still demanded exactly two, so the release was
            // blocked by the workflow rather than by the package. The roster is stated here in
            // order, so adding a fourth row fails loudly and is brought up to date deliberately
            // instead of slipping past a length that no longer means anything.
            const expected = ['newmark-core', 'preset-dev', 'preset-rdev'];
            if (rows.length !== expected.length || rows.some((row, i) => row !== expected[i])) {
              console.error('the patch must declare exactly ' + expected.join(', ') + ', found: ' + rows.join(', '));
              process.exit(1);
            }
            for (const name of ['newmark2dsh-memorylab', 'newmark2dsh-computeruse', 'newmark2dsh-agent-api']) {
              if (lines.some((line) => line.trim() === 'name: ' + JSON.stringify(name))) {
                console.error('the patch declares a row for ' + name);
                process.exit(1);
              }
            }
          " || fail=1

          # 3. The files the bundle cannot work without — one per component, plus the three
          #    the core row itself needs. `agent-api`'s entry is its seam, because a bundle that
          #    ships the Agent API's tools but not the module that drives the model call installs
          #    cleanly and then fails at the first run.
          for f in index.js client.js cordis.patch.yml components/memorylab/lib/memory-store.js components/computeruse/lib/win32.js components/computeruse/lib/overlay-win32.js components/agent-api/lib/llm-seam.js; do
            [ -f "$f" ] || { echo "::error::missing $f"; fail=1; }
          done

          exit $fail

      # A tag that reaches here publishes. `npm stage publish` is the alternative
      # when a human approval step is wanted instead: it needs no 2FA and leaves
      # the version staged until someone runs `npm stage approve <stage-id>`.
      - name: Publish
        run: npm publish --provenance --access public
